[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tariff-crypto-crawler"
version = "0.1.0"
description = "Read-only crawler + MCP server for public evidence of paying US customs duties in crypto"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "mcp>=2,<3"]
# Not published to PyPI; install from git or a local clone.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tariff-crypto-mcp = "crawler.mcp_server:main"
tariff-crypto-crawl = "crawler.crawl:main"

[tool.setuptools]
packages = ["crawler"]
